[package]
name = "codecrafters-claude-code"
version = "0.1.0"
authors = ["Codecrafters <hello@codecrafters.io>"]
edition = "2024"
rust-version = "1.94"

[dependencies]
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
] } # async runtime
async-openai = { version = "0.41.3", features = ["byot", "chat-completion"] }
clap = { version = "4.3.14", features = ["derive"] } # CLI argument parsing
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149" # JSON serialization/deserialization
dotenv = "0.15.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29.0"
ratatui-textarea = "0.9.2"
